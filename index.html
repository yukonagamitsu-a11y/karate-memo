<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>空手メモ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div id="childTabs" class="tabs"></div>
  <div class="row2">
    <div id="kataTabs" class="tabs kata"></div>
    <button id="menuBtn" class="icon" aria-label="メニュー">⋯</button>
  </div>
</header>

<main id="list"></main>

<button id="fab" aria-label="メモを追加">＋</button>

<div id="sheet" class="overlay" hidden>
  <div class="panel">
    <div class="bar">
      <button id="edClose" class="text">閉じる</button>
      <span id="edSaved" class="saved"></span>
      <button id="edDel" class="text danger">削除</button>
    </div>
    <div class="meta">
      <input type="date" id="edDate">
      <button id="edPin" class="pin" aria-label="自主練ピン">☆</button>
    </div>
    <textarea id="edBody" placeholder="習ったこと・注意されたことを書く"></textarea>
  </div>
</div>

<div id="menu" class="overlay" hidden>
  <div class="panel small">
    <h2>メニュー</h2>
    <button data-act="search">🔍 全体を検索</button>
    <button data-act="renameChild">👤 この子の名前・色を変更</button>
    <button data-act="renameKata">✏️ この形の名前を変更</button>
    <button data-act="left">◀ この形を左へ</button>
    <button data-act="right">▶ この形を右へ</button>
    <button data-act="delKata" class="danger">🗑 この形を削除</button>
    <button data-act="export">💾 バックアップを書き出す</button>
    <button data-act="import">📂 バックアップを読み込む</button>
    <button data-act="close" class="cancel">閉じる</button>
  </div>
</div>

<div id="search" class="overlay" hidden>
  <div class="panel">
    <div class="bar"><button id="seClose" class="text">閉じる</button></div>
    <input id="seInput" type="search" placeholder="メモの言葉で検索">
    <div id="seList"></div>
  </div>
</div>

<input type="file" id="file" accept="application/json" hidden>
<script src="app.js"></script>
</body>
</html>
